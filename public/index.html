<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CF Random Unsolved</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-pap6Y3..." crossorigin="anonymous" referrerpolicy="no-referrer">
  <meta name="description" content="A website to get a random codeforces problem that you have not solved.">
  <meta name="keywords"
    content="Codeforces, CF, Competitive Programming, Competitive Coding, CP, C++, DSA, node_overflow">
  <meta name="author" content="Piyush Jha">
</head>

<body>
  <canvas id="starCanvas" aria-hidden="true"></canvas>

  <div class="avatar"></div>

  <main class="container">
    <h1>📊 <span class="h1-text">CF Random Unsolved</span> 📊</h1>
    <p class="sub">Enter handle, pick tags + rating → get a random problem you haven't solved.</p>

    <form id="filterForm" class="glass">
      <div class="row">
        <label for="handle">Codeforces Handle</label>
        <input id="handle" name="handle" value="node_overflow" required>
      </div>

      <div class="field">
        <label>Tags:</label>
        <div id="tagsBox" class="tags-box">Loading tags…</div>
      </div>

      <div class="row two rating-div" style="gap: 25rem;">
        <div>
          <label for="min">Min Rating</label>
          <input id="min" name="min" type="number" min="800" max="3500" step="100" value="900">
        </div>
        <div>
          <label for="max">Max Rating</label>
          <input id="max" name="max" type="number" min="800" max="3500" step="100" value="1000">
        </div>
      </div>

      <div style="display: flex; flex-direction: row; gap: 2rem;">
        <label class="single_tag checkBox">
          <input type="checkbox" id="single_tag_checkbox">
          Tags only
        </label>

        <label class="is_ticked checkBox">
          <input type="checkbox" id="is_ticked_checkbox">
          Hide rating
        </label>

        <label class="tag_check checkBox">
          <input type="checkbox" id="tag_check_checkbox">
          Hide tags
        </label>
      </div>

      <button id="goBtn" type="submit" class="btn" style="user-select: none;">Get Random Problem &nbsp; <i
          class="fa-solid fa-arrow-up-right-from-square"></i></button>
    </form>

    <section id="result" class="card glass hidden">
      <div class="problem-header">
        <h2 id="probTitle"></h2>
        <div id="contestBadges" class="contest-badges" style="user-select: none;"></div>
      </div>
      <p id="probMeta" style="user-select: none;"></p>
      <p id="probDate" class="prob-date" style="user-select: none;"></p>
      <p id="probTags" style="user-select: none;"></p>

      <p id="probSolved" style="user-select: none;"></p>
      <div style="user-select: none !important;">
        <a id="probLink" target="_blank" rel="noopener" class="btn " style="text-decoration: none; color: #f1f3f5;">Open
          on Codeforces &nbsp; <i class="fa-solid fa-chart-simple" style="color: #5cd2f8a3;"></i></a>
        <a id="probContestLink" target="_blank" rel="noopener" class="btn" style="margin-left: 4px;">
          View Contest &nbsp; <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
        </a>
        <a id="againBtn" class="btn" style="margin-left: 4px;">Another &nbsp; <i
            class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </section>
    </div>

    <section id="status" class="status"></section>
  </main>

  <footer>
    <p>&copy; 2025 Piyush Jha (@node_overflow). All rights reserved.</p>
    <div class="social-panel" style="user-select: none;">
      <a href="https://github.com/node-overflow/cf-random-unsolved" target="_blank" rel="noopener" aria-label="GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://x.com/piyush_cpp" target="_blank" rel="noopener" aria-label="X (Twitter)">
        <i class="fa-brands fa-twitter"></i>
      </a>
      <a href="https://mail.google.com/mail/?view=cm&to=nodexoverflow@gmail.com" target="_blank" rel="noopener"
        aria-label="Email">
        <i class="fa-solid fa-envelope"></i>
      </a>
      <a href="https://codeforces.com/profile/node_overflow" target="_blank" rel="noopener"
        aria-label="Email">
        <i class="fa-solid fa-chart-simple"></i>
      </a>
    </div>
  </footer>

  <script src="js/stars.js" defer></script>
  <script type="module" src="/js/main.js" defer></script>
</body>

</html>
